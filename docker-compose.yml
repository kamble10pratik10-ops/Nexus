version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: satsa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: satsa_db
      POSTGRES_USER: satsa_admin
      POSTGRES_PASSWORD: SecureSupervisoryPassword2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsa_admin -d satsa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satsa-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://satsa_admin:SecureSupervisoryPassword2026!@postgres:5432/satsa_db
      AIR_GAPPED_MODE: "true"
      SECRET_KEY: "NCIIPC-AIR-GAPPED-ENTERPRISE-KEY-984321"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satsa-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
